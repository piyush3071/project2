<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Examoura | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            width: 380px;
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            color: white;
        }

        .login-card h3 {
            font-weight: bold;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .btn-custom {
            background: white;
            color: #4e73df;
            font-weight: 600;
            border-radius: 10px;
            padding: 10px;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background: #f8f9fc;
            transform: translateY(-2px);
        }

        .brand-icon {
            font-size: 40px;
        }
    </style>
</head>
<body>

<div class="login-card text-center">
    <div class="brand-icon mb-2">🎓</div>
    <h3>Examoura</h3>
    <p class="mb-4">Online Examination System</p>

    <div class="mb-3 text-start">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter your email">
    </div>

    <div class="mb-4 text-start">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password">
    </div>

    <button class="btn btn-custom w-100" onclick="login()">
        <i class="bi bi-box-arrow-in-right"></i> Login
    </button>

</div>

<script>
function login(){

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if(!email || !password){
        alert("Please enter email and password!");
        return;
    }

    let user;

    // 🔐 ADMIN LOGIN
    if(email === "admin@examoura.com" && password === "admin123"){
        user = {
            email: email,
            role: "admin"
        };
        localStorage.setItem("loggedInUser", JSON.stringify(user));
        window.location.href = "admin_dashboard.html";  
    }
    else if(email === "uday@gmail.com" && password === "uday123") {
        // 👨‍🎓 STUDENT LOGIN (ANY OTHER EMAIL)
        user = {
            email: email,
            role: "student"
        };
        localStorage.setItem("loggedInUser", JSON.stringify(user));
        window.location.href = "student_dashboard.html";
    }
    else if(email === "piyush@gmail.com" && password === "piyush123") {
        // 👨‍🎓 STUDENT LOGIN (ANY OTHER EMAIL)
        user = {
            email: email,
            role: "student"
        };
        localStorage.setItem("loggedInUser", JSON.stringify(user));
        window.location.href = "student_dashboard.html";
    }
    else{
        alert("access denied (invalid User)")
    }
}
</script>

</body>
</html>
