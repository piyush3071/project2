<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Examoura | Student Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>
body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: 'Segoe UI', sans-serif;
    overflow-x: hidden;
}

/* ===== NAVBAR ===== */
.navbar {
    background: #111827;
    border-bottom: 1px solid #1f2937;
}

.navbar-brand {
    font-weight: bold;
    color: #38bdf8 !important;
}

/* ===== SIDEBAR ===== */
.sidebar {
    height: 100vh;
    width: 240px;
    position: fixed;
    background: #111827;
    padding-top: 20px;
    border-right: 1px solid #1f2937;
}

.sidebar a {
    padding: 14px 20px;
    display: block;
    color: #94a3b8;
    text-decoration: none;
    transition: 0.3s;
}

.sidebar a:hover {
    background: #1e293b;
    color: #38bdf8;
    padding-left: 25px;
}

.sidebar .active {
    background: #1e293b;
    color: #38bdf8;
    border-left: 4px solid #38bdf8;
}

/* ===== MAIN ===== */
.main-content {
    margin-left: 240px;
    padding: 30px;
}

/* ===== CARDS ===== */
.stat-card {
    background: linear-gradient(135deg, #6366f1, #22d3ee);
    color: white;
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    transition: 0.3s;
}

.stat-card:hover {
    transform: translateY(-5px);
}

.card-dark {
    background: #1e293b;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 15px;
}

.btn-primary {
    background: #6366f1;
    border: none;
}

.btn-primary:hover {
    background: #4f46e5;
}
</style>
</head>
<body>

<script>
const user = JSON.parse(localStorage.getItem("loggedInUser"));
if(!user || user.role !== "student"){
    window.location.href = "index.html";
}
</script>

<!-- NAVBAR -->
<nav class="navbar navbar-dark px-4">
    <span class="navbar-brand">🎓 Examoura Student</span>
    <div class="text-light">
        <i class="bi bi-person-circle fs-5"></i>
        <span class="ms-2">Student</span>
    </div>
</nav>

<!-- SIDEBAR -->
<div class="sidebar">
    <a href="#" class="active" onclick="showSection('dashboard', this)">
        <i class="bi bi-speedometer2"></i> Dashboard
    </a>
    <a href="#" onclick="showSection('exams', this)">
        <i class="bi bi-journal-text"></i> Exams
    </a>
    <a href="#" onclick="showSection('results', this)">
        <i class="bi bi-bar-chart"></i> Results
    </a>
    <a href="#" onclick="logout()">
        <i class="bi bi-box-arrow-right"></i> Logout
    </a>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <!-- DASHBOARD SECTION -->
    <div id="dashboardSection">
        <h3 class="mb-4">Dashboard Overview</h3>

        <div class="row">
            <div class="col-md-4">
                <div class="stat-card text-center">
                    <h2 id="totalExams">0</h2>
                    <p>Total Exams</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="stat-card text-center">
                    <h2 id="givenExams">0</h2>
                    <p>Exams Given</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="stat-card text-center">
                    <h2>Online</h2>
                    <p>Status</p>
                </div>
            </div>
        </div>
    </div>

    <!-- EXAMS SECTION -->
    <div id="examsSection" style="display:none;">
        <h3>Available Exams</h3>
        <div id="examList" class="mt-3"></div>
    </div>

    <!-- RESULTS SECTION -->
    <div id="resultsSection" style="display:none;">
        <h3>Your Results</h3>
        <div id="resultsList" class="mt-3"></div>
    </div>

</div>

<script>

/* ===== SECTION SWITCH ===== */
function showSection(section, element){
    document.querySelectorAll(".sidebar a").forEach(a=>a.classList.remove("active"));
    if(element) element.classList.add("active");

    document.querySelectorAll(".main-content > div").forEach(div=>div.style.display="none");
    document.getElementById(section+"Section").style.display="block";

    if(section==="dashboard") loadDashboard();
    if(section==="exams") loadExams();
    if(section==="results") loadResults();
}

/* ===== DASHBOARD DATA ===== */
function loadDashboard(){
    const exams = JSON.parse(localStorage.getItem("exams")) || [];
    const results = JSON.parse(localStorage.getItem("results")) || [];

    const userResults = results.filter(r=>r.email === user.email);

    document.getElementById("totalExams").innerText = exams.length;
    document.getElementById("givenExams").innerText = userResults.length;
}

/* ===== LOAD EXAMS ===== */
function loadExams(){
    const exams = JSON.parse(localStorage.getItem("exams")) || [];
    const box = document.getElementById("examList");

    let html="";
    exams.forEach(exam=>{
        html+=`
            <div class="card-dark">
                <strong>${exam.title}</strong><br>
                Duration: ${exam.duration}s<br>
                Questions: ${exam.questions.length}<br><br>
                <button class="btn btn-primary btn-sm" onclick="startExam(${exam.id})">
                    Start Exam
                </button>
            </div>
        `;
    });

    box.innerHTML = html || "No exams available.";
}

function startExam(id){
    localStorage.setItem("currentExam", id);
    window.location.href = "exam.html";
}


/* ===== LOAD RESULTS ===== */
function loadResults(){
    const results = JSON.parse(localStorage.getItem("results")) || [];
    const box = document.getElementById("resultsList");

    const userResults = results.filter(r=>r.email===user.email);

    let html="";
    userResults.forEach(r=>{
        html+=`
            <div class="card-dark">
                ${r.examTitle}<br>
                Score: ${r.score}/${r.total}
            </div>
        `;
    });

    box.innerHTML = html || "No results yet.";
}

/* ===== LOGOUT ===== */
function logout(){
    localStorage.removeItem("loggedInUser");
    window.location.href = "index.html";
}

/* INIT */
loadDashboard();

</script>

</body>
</html>
